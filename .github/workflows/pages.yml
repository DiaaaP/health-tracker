name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML and static assets
        run: python3 tests/check_frontend.py
      - name: Validate JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/tracking.js
      - name: Check tracking modes and offline calendar
        run: node tests/check_tracking.cjs
      - name: Check guest and account identity
        run: node tests/check_profile_identity.cjs
      - name: Check deletion confirmation and analytics actions
        run: node tests/check_hci_ux.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Choose a unique artifact name
        id: artifact-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
